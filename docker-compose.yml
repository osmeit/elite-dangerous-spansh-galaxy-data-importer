services:
  db:
    image: postgis/postgis:latest
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: spansh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d spansh"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: pawcio07890@gmail.com
      PGADMIN_DEFAULT_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin


  p:
    image: node:latest
    container_name: json_processor
    working_dir: /app
    volumes:
      - ./:/app
      - ./json:/app/json
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: spansh
      PGOPTIONS: "-c work_mem=1GB -c maintenance_work_mem=4GB -c max_parallel_workers_per_gather=0"
      NODE_OPTIONS: "--max-old-space-size=8192"
    env_file:
      - .env.processor
    depends_on:
      - db
    networks:
      - app_network
    # command: sh -c "npm install && node analyze-structure.js"
    command: sh -c "npm install && node bulk-import2.js"
    # command: sh -c "npm install && node process-json.js"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
    driver: bridge